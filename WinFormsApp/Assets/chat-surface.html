<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:light;--paper:#fff;--line:#e7e9ee;--ink:#202431;--muted:#737989;--subtle:#979eac;--brand:#5967dc;--brand-soft:#eef0ff;--green:#23855b;--green-soft:#eaf7f0;--amber:#956b18;--red:#b74943}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Segoe UI",Arial,sans-serif;overflow:hidden}
    .view{height:100%;display:flex;flex-direction:column;background:var(--paper)}
    .topbar{flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;border-bottom:1px solid var(--line)}
    .title{min-width:0}.title h1{overflow:hidden;margin:0;font-size:16px;font-weight:700;letter-spacing:-.015em;text-overflow:ellipsis;white-space:nowrap}.subtitle{display:flex;align-items:center;gap:7px;margin-top:2px;color:var(--muted);font-size:11px}
    .dot{width:7px;height:7px;flex:none;border-radius:50%;background:#34a474}.actions{display:flex;align-items:center;gap:8px}.badge{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--green);font-size:11px;font-weight:600}
    .messages{flex:1;min-height:0;overflow:auto;padding:24px max(20px,calc((100% - 820px)/2));scroll-behavior:smooth}.day{margin:0 0 22px;color:var(--subtle);font-size:10px;font-weight:650;text-align:center}
    .message{display:flex;align-items:flex-start;gap:11px;margin:0 0 24px}.message.user{flex-direction:row-reverse}.avatar{display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;border-radius:10px;background:#eef0ff;color:#4c59c8;font-size:10px;font-weight:800}.message.user .avatar{background:#edf0f4;color:#596071}.bubble{min-width:0;max-width:min(100%,740px)}.message.user .bubble{max-width:min(84%,620px);padding:10px 14px;border:1px solid #e9ebf1;border-radius:14px 4px 14px 14px;background:#f5f6f9}
    .head{display:flex;align-items:baseline;gap:8px;margin:0 0 7px}.head strong{font-size:12px}.head time,.model{color:var(--muted);font-size:10px}.body{color:#343a49;font-size:13px;line-height:1.72;overflow-wrap:anywhere}.body p{margin:0 0 10px}.body p:last-child{margin-bottom:0}.body h2,.body h3{margin:16px 0 6px;font-size:15px;line-height:1.35}.body ul,.body ol{margin:5px 0 12px;padding-left:21px}.body li{margin:3px 0}.body a{color:#4658ca;text-decoration:underline;text-underline-offset:2px}.body blockquote{margin:11px 0;padding:8px 12px;border-left:3px solid #aab1f3;background:#f6f7ff;color:#555d70}.body code:not(pre code){padding:1px 4px;border-radius:4px;background:#f0f2f6;color:#354158;font:12px "Cascadia Code",Consolas,monospace}
    .thinking{margin:0 0 12px;border:1px solid #eceef2;border-radius:9px;background:#fbfbfc}.thinking summary{padding:7px 10px;color:#858b99;cursor:pointer;font-size:11px;font-weight:650;list-style:none}.thinking summary::-webkit-details-marker{display:none}.thinking summary:before{content:"›";display:inline-block;width:15px;color:#8b91a0;font-size:17px;vertical-align:-1px}.thinking[open] summary:before{content:"⌄"}.thinking-text{padding:0 11px 10px;color:#858b99;font-size:11px;font-style:italic;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
    .code-card{overflow:hidden;margin:12px 0;border:1px solid #e5e7ec;border-radius:11px;background:#f8f9fb}.code-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-bottom:1px solid #e5e7ec;color:#626a79;font-size:10px;font-weight:650}.code-actions{display:flex;gap:6px}.code-actions button,.msg-actions button{padding:5px 9px;border:1px solid #e1e4ea;border-radius:0;background:white;color:#596172;cursor:pointer;font-size:10px}.code-actions button:hover,.msg-actions button:hover{background:#f2f3f8}pre{overflow:auto;margin:0;padding:12px 14px;color:#263247;font:12px/1.6 "Cascadia Code",Consolas,monospace;tab-size:4;white-space:pre}
    .msg-actions{display:flex;gap:6px;margin-top:8px}.msg-actions button{border-color:transparent;color:#778091;background:transparent}.system{display:flex;justify-content:center;margin:0 0 14px}.system-card{max-width:90%;padding:7px 11px;border:1px solid #e8ebf0;border-radius:9px;background:#fafbfc;color:#667082;font-size:11px}.system.success .system-card{border-color:#dcefe4;background:#f3fbf6;color:#287451}.system.warning .system-card{border-color:#f1e6c9;background:#fffbf0;color:#8b671b}.system.error .system-card{border-color:#f1d9d7;background:#fff7f6;color:#a6453e}
    .activity-wrap{flex:none;padding:0 24px}.activity{display:none;max-width:820px;margin:0 auto 8px;padding:8px 11px;border:1px solid #e7e9ef;border-radius:9px;background:#fbfcfe;color:#687183;font-size:11px}.activity.visible{display:flex;align-items:center;gap:8px}.activity .dot{animation:pulse 1.4s infinite}.activity.thinking{color:#858b99;font-style:italic}.toast{position:absolute;right:20px;bottom:16px;z-index:2;max-width:320px;padding:8px 12px;border:1px solid #e3e6ed;border-radius:9px;background:#fff;box-shadow:0 6px 20px #20243118;color:#454d5c;font-size:11px;opacity:0;transform:translateY(5px);transition:all .18s}.toast.show{opacity:1;transform:translateY(0)}
    @keyframes pulse{50%{box-shadow:0 0 0 5px #5967dc18;opacity:.55}}
    @media(max-width:700px){.topbar{padding:0 15px}.messages{padding:18px 14px}.actions .optional{display:none}.activity-wrap{padding:0 14px}.message.user .bubble{max-width:88%}}
  </style>
</head>
<body>
  <main class="view">
    <header class="topbar">
      <div class="title"><h1 id="conversation-title">Nouvelle conversation</h1><div class="subtitle"><span class="dot"></span><span id="model-name">Aucun modèle sélectionné</span><span>·</span><span>Enregistrée automatiquement</span></div></div>
      <div class="actions"><span class="badge"><span class="dot"></span> Local</span></div>
    </header>
    <section class="messages" id="messages" aria-label="Messages de la conversation"><div class="day">Début de la conversation</div></section>
    <div class="activity-wrap"><div class="activity" id="activity"><span class="dot"></span><span id="activity-text"></span></div></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const host = document.getElementById('messages');
      const activity = document.getElementById('activity');
      const activityText = document.getElementById('activity-text');
      const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const post = data => { if (window.chrome?.webview) window.chrome.webview.postMessage(data); };

      function safeHref(value) {
        const url = String(value || '').trim();
        return /^(https?:\/\/|mailto:)/i.test(url) && !/[\u0000-\u001f]/.test(url) ? url : '';
      }
      function inline(text) {
        const pattern = /(`[^`]+`|\[[^\]]+\]\((?:https?:\/\/|mailto:)[^)]+\)|https?:\/\/[^\s<>()]+|\*\*[^*]+\*\*|~~[^~]+~~|(?<!\*)\*[^*]+\*(?!\*))/g;
        let result = '', cursor = 0, match;
        while ((match = pattern.exec(text)) !== null) {
          result += esc(text.slice(cursor, match.index));
          const token = match[0];
          if (token.startsWith('`')) result += '<code>' + esc(token.slice(1, -1)) + '</code>';
          else if (token.startsWith('[')) {
            const split = token.lastIndexOf(']('), label = token.slice(1, split), href = safeHref(token.slice(split + 2, -1));
            result += href ? '<a href="' + esc(href) + '" rel="noreferrer">' + esc(label) + '</a>' : esc(label);
          } else if (/^https?:\/\//i.test(token)) {
            const url = token.replace(/[.,!?;:]+$/, ''), suffix = token.slice(url.length), href = safeHref(url);
            result += href ? '<a href="' + esc(href) + '" rel="noreferrer">' + esc(url) + '</a>' + esc(suffix) : esc(token);
          } else if (token.startsWith('**')) result += '<strong>' + esc(token.slice(2, -2)) + '</strong>';
          else if (token.startsWith('~~')) result += '<del>' + esc(token.slice(2, -2)) + '</del>';
          else result += '<em>' + esc(token.slice(1, -1)) + '</em>';
          cursor = match.index + token.length;
        }
        return result + esc(text.slice(cursor));
      }
      function languageExtension(language) {
        const map = {python:'py',py:'py',csharp:'cs','c#':'cs',cs:'cs',javascript:'js',js:'js',typescript:'ts',ts:'ts',html:'html',css:'css',json:'json',bash:'sh',sh:'sh',shell:'sh',powershell:'ps1',ps1:'ps1',sql:'sql',java:'java',c:'c',cpp:'cpp','c++':'cpp',rust:'rs',go:'go',ruby:'rb',php:'php',xml:'xml',yaml:'yml',yml:'yml',markdown:'md',md:'md',text:'txt',txt:'txt'};
        return map[String(language || '').trim().toLowerCase()] || 'txt';
      }
      function codeCard(language, code) {
        const label = language ? esc(language) : 'Code';
        return '<div class="code-card"><div class="code-head"><span>' + label + '</span><span class="code-actions"><button type="button" data-action="copy-code">Copier</button><button type="button" data-action="download-code" data-filename="script.' + languageExtension(language) + '">Télécharger</button></span></div><pre><code>' + esc(code) + '</code></pre></div>';
      }
      function markdown(source) {
        const codeBlocks = [];
        let text = String(source ?? '').replace(/```([^\r\n`]*)\r?\n([\s\S]*?)```/g, (_, lang, code) => {
          const index = codeBlocks.push({language:lang.trim(), code:code.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\n$/, '')}) - 1;
          return '\u0000CODE' + index + '\u0000';
        });
        const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        const out = []; let paragraph = [], listType = '';
        const flushParagraph = () => { if (paragraph.length) { out.push('<p>' + paragraph.map(inline).join('<br>') + '</p>'); paragraph = []; } };
        const closeList = () => { if (listType) { out.push('</' + listType + '>'); listType = ''; } };
        for (const line of lines) {
          const codeMatch = /^\u0000CODE(\d+)\u0000$/.exec(line);
          if (codeMatch) { flushParagraph(); closeList(); const block = codeBlocks[Number(codeMatch[1])] || {language:'', code:''}; out.push(codeCard(block.language, block.code)); continue; }
          const heading = /^(#{1,3})\s+(.+)$/.exec(line);
          const unordered = /^\s*[-*+]\s+(.+)$/.exec(line);
          const ordered = /^\s*\d+[.)]\s+(.+)$/.exec(line);
          const quote = /^>\s?(.*)$/.exec(line);
          if (!line.trim()) { flushParagraph(); closeList(); continue; }
          if (heading) { flushParagraph(); closeList(); const n = heading[1].length + 1; out.push('<h' + n + '>' + inline(heading[2]) + '</h' + n + '>'); continue; }
          if (unordered || ordered) {
            flushParagraph(); const type = unordered ? 'ul' : 'ol';
            if (listType !== type) { closeList(); listType = type; out.push('<' + type + '>'); }
            out.push('<li>' + inline((unordered || ordered)[1]) + '</li>'); continue;
          }
          if (quote) { flushParagraph(); closeList(); out.push('<blockquote>' + inline(quote[1]) + '</blockquote>'); continue; }
          closeList(); paragraph.push(line);
        }
        flushParagraph(); closeList();
        return out.join('');
      }
      function entryBody(entry, index, preserveOpen) {
        const thinking = entry.thinking ? '<details class="thinking" data-thinking="' + index + '"' + (entry.streaming ? ' open' : '') + '><summary>Réflexion' + (entry.streaming ? ' · en cours' : ' · cliquer pour afficher') + '</summary><div class="thinking-text">' + markdown(entry.thinking) + '</div></details>' : '';
        return thinking + '<div class="body message-content">' + markdown(entry.content || '') + '</div>';
      }
      function renderEntry(entry, index) {
        if (entry.role === 'system') return '<article class="system ' + esc(entry.systemKind || 'info') + '"><div class="system-card"><strong>' + esc(entry.sender) + '</strong> · ' + esc(entry.time) + ' — ' + markdown(entry.content || '') + '</div></article>';
        const user = entry.role === 'user';
        const sender = user ? 'Vous' : (entry.sender || 'Assistant');
        const avatar = user ? '' : '<div class="avatar" aria-hidden="true">IA</div>';
        const model = user ? '' : '<span class="model">' + esc(document.getElementById('model-name').textContent) + '</span>';
        const actions = !user && !entry.streaming ? '<div class="msg-actions"><button type="button" data-action="copy-answer">Copier la réponse</button></div>' : '';
        return '<article class="message ' + (user ? 'user' : 'assistant') + '" data-message-index="' + index + '">' + avatar + '<div class="bubble"><div class="head"><strong>' + esc(sender) + '</strong>' + model + '<time>' + esc(entry.time) + '</time></div><div class="entry-body">' + entryBody(entry, index) + '</div>' + actions + '</div></article>';
      }
      function atBottom() { return host.scrollHeight - host.scrollTop - host.clientHeight < 45; }
      function render(entries, forceBottom) {
        const shouldScroll = Boolean(forceBottom) || atBottom();
        const expanded = new Map([...host.querySelectorAll('details[data-thinking]')].map(item => [item.dataset.thinking, item.open]));
        host.innerHTML = '<div class="day">Conversation</div>' + entries.map(renderEntry).join('');
        for (const details of host.querySelectorAll('details[data-thinking]')) {
          if (expanded.has(details.dataset.thinking)) details.open = expanded.get(details.dataset.thinking);
        }
        if (shouldScroll) host.scrollTop = host.scrollHeight;
      }
      function updateStreaming(index, entry) {
        const article = host.querySelector('[data-message-index="' + index + '"]');
        if (!article) { render([], true); return; }
        const wasBottom = atBottom();
        const details = article.querySelector('details[data-thinking]');
        const wasOpen = details?.open;
        article.querySelector('.entry-body').innerHTML = entryBody(entry, index);
        const nextDetails = article.querySelector('details[data-thinking]');
        if (nextDetails && typeof wasOpen === 'boolean') nextDetails.open = wasOpen;
        if (wasBottom) host.scrollTop = host.scrollHeight;
      }
      function setActivity(text) {
        const value = String(text || '');
        activityText.textContent = value;
        activity.classList.toggle('visible', Boolean(value));
        activity.classList.toggle('thinking', value.toLowerCase().includes('réflexion'));
      }
      let toastTimer;
      function notify(text) {
        const toast = document.getElementById('toast');
        toast.textContent = String(text || ''); toast.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
      }
      function setHeader(title, model) {
        document.getElementById('conversation-title').textContent = title || 'Nouvelle conversation';
        document.getElementById('model-name').textContent = model || 'Aucun modèle sélectionné';
      }
      host.addEventListener('click', event => {
        const link = event.target.closest('a');
        if (link) { event.preventDefault(); post({action:'openLink', url:link.href}); return; }
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const article = button.closest('article');
        if (button.dataset.action === 'copy-code') {
          const text = button.closest('.code-card')?.querySelector('pre code')?.innerText || '';
          post({action:'copy', text});
        } else if (button.dataset.action === 'download-code') {
          const text = button.closest('.code-card')?.querySelector('pre code')?.innerText || '';
          post({action:'download', filename:button.dataset.filename || 'script.txt', text});
        } else if (button.dataset.action === 'copy-answer') {
          post({action:'copy', text:article?.querySelector('.message-content')?.innerText || ''});
        }
      });
      window.localIA = {render, updateStreaming, setActivity, setHeader, notify};
      setHeader('Nouvelle conversation', 'Aucun modèle sélectionné');
    })();
  </script>
</body>
</html>
