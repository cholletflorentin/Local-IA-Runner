name: Build and publish Windows release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[publish-release]'))
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build installer and portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseListOutput = gh release list --limit 100 --json tagName 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Output $releaseListOutput; throw "Unable to list GitHub releases." }
          $releases = @($releaseListOutput | Out-String | ConvertFrom-Json)
          $versionNumbers = @($releases | ForEach-Object {
            if ($_.tagName -match '^v1\.0\.(\d+)$') { [int]$Matches[1] }
          })
          if ($versionNumbers.Count -eq 0) { $versionNumber = 17 }
          else { $versionNumber = ($versionNumbers | Measure-Object -Maximum).Maximum + 1 }
          $version = "1.0.$versionNumber"
          & .\WinFormsApp\Installer\build-installer.ps1 -AppVersion $version
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }
          & .\WinFormsApp\Installer\build-portable.ps1 -AppVersion $version
          if ($LASTEXITCODE -ne 0) { throw "Portable package build failed." }

      - name: Publish GitHub release and update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseListOutput = gh release list --limit 100 --json tagName 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Output $releaseListOutput; throw "Unable to list GitHub releases." }
          $releases = @($releaseListOutput | Out-String | ConvertFrom-Json)

          $commitSubject = (git log -1 --format=%s).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to read commit subject." }
          $commitBody = (git log -1 --format=%b | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to read commit description." }
          $releaseSummary = $commitSubject -replace '^\[publish-release\]\s*', ''
          if ([string]::IsNullOrWhiteSpace($releaseSummary)) { $releaseSummary = "Améliorations de Local IA Runner" }
          $changeSection = if ([string]::IsNullOrWhiteSpace($commitBody)) {
            "- $releaseSummary"
          } else {
            "### $releaseSummary`n`n$commitBody"
          }

          $versionNumbers = @($releases | ForEach-Object {
            if ($_.tagName -match '^v1\.0\.(\d+)$') { [int]$Matches[1] }
          })
          if ($versionNumbers.Count -eq 0) { $versionNumber = 17 }
          else { $versionNumber = ($versionNumbers | Measure-Object -Maximum).Maximum + 1 }
          $version = "1.0.$versionNumber"
          $tag = "v$version"
          $installer = "artifacts\installer\LocalIARunner-Setup-x64.exe"
          $portable = "artifacts\portable\LocalIARunner-Portable-x64-$version.zip"
          $notes = @"
          ## Nouveautés de Local IA Runner $version

          $changeSection

          ## Téléchargements

          - `LocalIARunner-Setup-x64.exe` : installateur Windows 10/11 x64. L'application l'utilise aussi pour appliquer les mises à jour.
          - `LocalIARunner-Portable-x64-$version.zip` : version portable à extraire et lancer.

          Les modèles IA ne sont pas inclus; ils doivent être téléchargés séparément ou déjà présents sur l'ordinateur.
          "@

          $existingRelease = $releases | Where-Object { $_.tagName -eq $tag }
          if ($existingRelease) {
            gh release upload $tag $installer $portable --clobber
            if ($LASTEXITCODE -ne 0) { throw "Unable to upload release assets." }
            gh release edit $tag --title "Local IA Runner $version" --notes $notes
          }
          else {
            gh release create $tag $installer $portable --title "Local IA Runner $version" --notes $notes --target $env:GITHUB_SHA --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed (gh exit code $LASTEXITCODE)." }

          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSize = [long](Get-Item -LiteralPath $installer).Length
          $portableSize = [long](Get-Item -LiteralPath $portable).Length
          $manifest = [ordered]@{
            tag_name = $tag
            html_url = "https://github.com/cholletflorentin/Local-IA-Runner/releases/tag/$tag"
            body = $notes
            assets = @(
              [ordered]@{
                name = "LocalIARunner-Setup-x64.exe"
                browser_download_url = "https://github.com/cholletflorentin/Local-IA-Runner/releases/download/$tag/LocalIARunner-Setup-x64.exe"
                digest = "sha256:$installerHash"
                size = $installerSize
              },
              [ordered]@{
                name = "LocalIARunner-Portable-x64-$version.zip"
                browser_download_url = "https://github.com/cholletflorentin/Local-IA-Runner/releases/download/$tag/LocalIARunner-Portable-x64-$version.zip"
                digest = "sha256:$portableHash"
                size = $portableSize
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath 'latest-release.json' -Encoding utf8

          gh release upload $tag 'latest-release.json' --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload the latest-release manifest." }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- latest-release.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "[skip ci] Update latest release manifest"
            if ($LASTEXITCODE -ne 0) { throw "Unable to commit the latest-release manifest." }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw "Unable to publish the latest-release manifest." }
          }
