name: Build and publish Uno beta

on:
  push:
    branches:
      - main
    paths:
      - 'UnoApp/**'
      - '.github/workflows/uno-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uno-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            rid: win-x64
            archive: LocalIARunner-Uno-Windows-x64.zip
            llama_asset: llama-b12676-bin-win-cpu-x64.zip
            llama_sha256: fdf78a3924fe92ccfb24af58544a6dccbc1feeb0587e77fca9ec3bef6737086c
          - label: Linux x64
            runner: ubuntu-latest
            rid: linux-x64
            archive: LocalIARunner-Uno-Linux-x64.zip
            llama_asset: llama-b12676-bin-ubuntu-x64.tar.gz
            llama_sha256: c65369a8574d096d90c593fef0e77a1ba2abfdfa7e7e9426bbf8939781ef8a07
          - label: macOS x64
            runner: macos-15-intel
            rid: osx-x64
            archive: LocalIARunner-Uno-macOS-x64.zip
            llama_asset: llama-b12676-bin-macos-x64.tar.gz
            llama_sha256: 10f36c786606e874f7440a87b48716dbd19f4bc6670e7dcd005e43c61977e6ef
          - label: macOS ARM64
            runner: macos-latest
            rid: osx-arm64
            archive: LocalIARunner-Uno-macOS-arm64.zip
            llama_asset: llama-b12676-bin-macos-arm64.tar.gz
            llama_sha256: a222d1ba06a3f0215fa7d22f372af6ba74c5b4cfca5f6b2aa6974c7b63017b59
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10 and Uno SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: UnoApp/global.json

      - name: Publish desktop app
        working-directory: UnoApp
        run: dotnet publish LocalIARunner.Uno.csproj -c Release -f net10.0-desktop -r ${{ matrix.rid }} -p:TargetFrameworks=net10.0-desktop -p:SelfContained=true -p:UseMonoRuntime=false -o "${{ runner.temp }}/uno-publish"

      - name: Bundle llama.cpp b12676
        shell: pwsh
        run: |
          $assetName = '${{ matrix.llama_asset }}'
          $expectedSha256 = '${{ matrix.llama_sha256 }}'
          $archivePath = Join-Path '${{ runner.temp }}' $assetName
          $engineDirectory = Join-Path '${{ runner.temp }}' 'uno-publish/llama-bin'
          New-Item -ItemType Directory -Force -Path $engineDirectory | Out-Null
          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/releases/download/b12676/$assetName" -OutFile $archivePath
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "llama.cpp archive hash mismatch: $assetName" }
          if ($assetName.EndsWith('.zip', [StringComparison]::OrdinalIgnoreCase)) {
            Expand-Archive -LiteralPath $archivePath -DestinationPath $engineDirectory -Force
          }
          else {
            & tar -xzf $archivePath -C $engineDirectory
            if ($LASTEXITCODE -ne 0) { throw "Could not extract $assetName" }
          }
          $serverName = if ($IsWindows) { 'llama-server.exe' } else { 'llama-server' }
          $server = Get-ChildItem -LiteralPath $engineDirectory -Filter $serverName -File -Recurse | Select-Object -First 1
          if (-not $server) { throw "$serverName is missing from $assetName" }
          if (-not $IsWindows) {
            & chmod +x $server.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Could not mark llama-server executable.' }
          }
          if ($IsWindows) {
            foreach ($runtimeName in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
              $runtimeSource = Join-Path $env:WINDIR "System32/$runtimeName"
              if (-not (Test-Path -LiteralPath $runtimeSource)) { throw "Missing MSVC runtime: $runtimeSource" }
              Copy-Item -LiteralPath $runtimeSource -Destination $server.DirectoryName -Force
            }
          }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'WinFormsApp/Installer/licenses/llama.cpp-LICENSE.txt') -Destination (Join-Path $engineDirectory 'LICENSE-llama.cpp.txt')
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'UnoApp/run-llama-server.cmd') -Destination (Join-Path '${{ runner.temp }}' 'uno-publish')
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'UnoApp/run-llama-server.sh') -Destination (Join-Path '${{ runner.temp }}' 'uno-publish')
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'UnoApp/README.md') -Destination (Join-Path '${{ runner.temp }}' 'uno-publish')
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'UnoApp/THIRD-PARTY-NOTICES.txt') -Destination (Join-Path '${{ runner.temp }}' 'uno-publish')

      - name: Package desktop app
        shell: pwsh
        run: Compress-Archive -Path "${{ runner.temp }}/uno-publish/*" -DestinationPath "${{ runner.temp }}/${{ matrix.archive }}" -Force

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ runner.temp }}/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 3

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up .NET 10 and Uno SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: UnoApp/global.json

      - name: Install .NET Android workload
        working-directory: UnoApp
        run: dotnet workload install android

      - name: Bundle llama.cpp b12676 into the APK
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'UnoApp/Assets'
          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null
          $archivePath = Join-Path $assetDirectory 'llama-b12676-android-arm64.tar.gz'
          Invoke-WebRequest -Uri 'https://github.com/ggml-org/llama.cpp/releases/download/b12676/llama-b12676-bin-android-arm64.tar.gz' -OutFile $archivePath
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne 'b357eab59d818f4f25f6908d4ea1d3142710c5a2c9fd5755d1e66f297a140dcc') { throw 'llama.cpp Android archive hash mismatch.' }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'WinFormsApp/Installer/licenses/llama.cpp-LICENSE.txt') -Destination (Join-Path $assetDirectory 'llama.cpp-LICENSE.txt')

      - name: Sign and publish installable beta APK
        shell: pwsh
        working-directory: UnoApp
        run: |
          $keyPath = Join-Path '${{ runner.temp }}' 'uno-beta.keystore'
          $password = [Guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          & keytool -genkeypair -noprompt -keystore $keyPath -alias uno-beta -storepass $password -keypass $password -dname 'CN=Local IA Runner Beta' -keyalg RSA -keysize 2048 -validity 10000
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the temporary Android signing key.' }
          $publishDir = Join-Path '${{ runner.temp }}' 'uno-android'
          $publishArgs = @(
            'publish', 'LocalIARunner.Uno.csproj', '-c', 'Release', '-f', 'net10.0-android',
            '-p:TargetFrameworks=net10.0-android', '-p:AndroidPackageFormats=apk',
            '-p:AndroidKeyStore=true', "-p:AndroidSigningKeyStore=$keyPath",
            '-p:AndroidSigningKeyAlias=uno-beta', "-p:AndroidSigningKeyPass=$password",
            "-p:AndroidSigningStorePass=$password", "-o", $publishDir
          )
          $buildLog = Join-Path '${{ runner.temp }}' 'uno-android-build.log'
          & dotnet @publishArgs 2>&1 | Tee-Object -FilePath $buildLog
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $lines = Get-Content -LiteralPath $buildLog
            $diagnostics = @($lines | Where-Object { $_ -match '(?i)(error|failed|APT\d+|resource .*not found|AndroidManifest)' } | Select-Object -Last 25)
            if ($diagnostics.Count -eq 0) { $diagnostics = @($lines | Select-Object -Last 40) }
            $details = @('## Android build diagnostics', '', '```text') + $diagnostics + @('```')
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($details -join "`n") -Encoding utf8
            }
            foreach ($line in $diagnostics) {
              $safeLine = $line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Android compiler detail::$safeLine"
            }
            throw "Android APK publishing failed with exit code $buildExitCode."
          }
          $apk = Get-ChildItem -Path @($publishDir, 'bin/Release/net10.0-android') -Filter '*Signed.apk' -Recurse | Select-Object -First 1
          if (-not $apk) { throw 'The Android build did not produce an APK.' }
          Copy-Item -LiteralPath $apk.FullName -Destination '${{ runner.temp }}/LocalIARunner-Uno-Android.apk' -Force

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: LocalIARunner-Uno-Android.apk
          path: ${{ runner.temp }}/LocalIARunner-Uno-Android.apk
          if-no-files-found: error
          retention-days: 3

  release-beta:
    name: Publish GitHub beta release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download build packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="uno-v0.1.0-beta.${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<'NOTES'
          ## Local IA Runner — bêta Uno Platform

          Version mise à jour de l'application multi-plateforme Uno, publiée séparément de la version WinForms stable.

          ### Téléchargements
          - Windows x64, Linux x64 et macOS x64/ARM64 : archives portables de l'interface Uno avec llama.cpp b12676 CPU et un lanceur.
          - Android : APK de test avec l'archive llama.cpp b12676 pour Android ARM64 intégrée.

          ### À savoir
          L'application Uno reste un client de chat : le modèle GGUF et le serveur doivent être lancés séparément. Sur ordinateur, les archives incluent llama.cpp et `run-llama-server.cmd` ou `run-llama-server.sh`. L'APK inclut maintenant le paquet llama.cpp Android ARM64; l'application ne démarre pas encore ce moteur elle-même et doit se connecter à un serveur compatible déjà lancé. L'intégration du backend Python, de stable-diffusion.cpp, des outils, du forum, des sous-agents et des réglages avancés n'est pas encore portée dans l'application Uno. L'APK de test est signé avec une clé temporaire; il faut désinstaller l'ancienne bêta Android avant d'installer celle-ci.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Local IA Runner — bêta Uno Platform ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md --prerelease
          else
            gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Local IA Runner — bêta Uno Platform ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md --prerelease --target "$GITHUB_SHA"
          fi
